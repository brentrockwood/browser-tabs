name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Required checks on macOS and Linux. Runs the exact same commands on both —
  # no OS-specific branching — so this is a real cross-platform proof, not
  # merely a Linux-flavored label on a macOS-only job.
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run check:versions
      - run: npm test
      - run: npm audit --omit=dev
      - name: Service lifecycle (start/health/authenticated request/restart/stop, no database)
        run: npm run check:service-lifecycle

  # Real-browser smoke tests use standalone official browser builds instead of
  # Ubuntu's Snap launchers. SMOKE_FAIL (exit 1) and SMOKE_BLOCKED (exit 2)
  # both fail this job so a green check proves the browser tests actually ran.
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Configure Chrome for the hosted runner
        run: |
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "${{ steps.chrome.outputs.chrome-path }}" > "$RUNNER_TEMP/chrome-ci"
          chmod +x "$RUNNER_TEMP/chrome-ci"
      - name: Install Firefox
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1
      - name: Install geckodriver
        run: |
          archive="$RUNNER_TEMP/geckodriver.tar.gz"
          curl -fsSL https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz -o "$archive"
          echo "e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Chromium read-API smoke
        env:
          CHROME_PATH: ${{ runner.temp }}/chrome-ci
        run: npm run test:smoke
      - name: Chromium bridge, mutation, and restart smoke
        env:
          CHROME_PATH: ${{ runner.temp }}/chrome-ci
        run: npm run test:smoke:bridge
      - name: Firefox read-API and unsupported-mutation smoke
        env:
          FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}
        run: npm run test:smoke:firefox
